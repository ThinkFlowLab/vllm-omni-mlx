[build-system]
# setuptools>=77 for PEP 639 SPDX license expressions
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-omni-mlx"
version = "0.1.0"
description = "Lightweight OpenAI- and Anthropic-compatible omni-modality inference server for Apple Silicon (MLX)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx-lm>=0.28",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/ThinkFlowLab/vllm-omni-mlx"
Repository = "https://github.com/ThinkFlowLab/vllm-omni-mlx"
Issues = "https://github.com/ThinkFlowLab/vllm-omni-mlx/issues"
Changelog = "https://github.com/ThinkFlowLab/vllm-omni-mlx/releases"

[project.optional-dependencies]
omni = ["mlx-vlm>=0.7"]
tts = ["mlx-audio>=0.5.7,<0.6"]
# minor-capped like mlx-audio: the mflux seam touches mflux.models.* internals
# (loader classes), so a minor bump is an adaptation PR, not a free upgrade
image = ["mflux>=0.21.0,<0.22"]

[project.scripts]
# serve/tts subcommands, upstream vllm-omni's `vllm serve <model> --omni` shape
vllm-omni-mlx = "vllm_omni_mlx.__main__:main"

[tool.setuptools]
packages = ["vllm_omni_mlx", "vllm_omni_mlx.tts", "vllm_omni_mlx.diffusion"]
