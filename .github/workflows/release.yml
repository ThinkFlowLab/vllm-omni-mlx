# Build and publish to PyPI via Trusted Publishing (OIDC) — no stored tokens.
#
# One-time PyPI side (pypi.org → Account settings → Publishing → add a
# pending publisher), only needed before the first run:
#   owner: ThinkFlowLab   repository: vllm-omni-mlx
#   workflow filename: release.yml   environment: pypi
#
# Publishes on `v*` tag pushes; `workflow_dispatch` lets you publish the
# current version from a chosen ref (used for the 0.1.0 bootstrap).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: build + publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # OIDC claim for trusted publishing + attestations
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
